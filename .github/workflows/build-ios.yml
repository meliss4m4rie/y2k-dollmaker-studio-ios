name: Build iOS Dollmaker

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies & sync iOS
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          npx cap sync ios

      - name: Build iOS target (unsigned verification)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-y2k-dollmaker-ios
          path: build/ios/Build/Products/Release-iphoneos/